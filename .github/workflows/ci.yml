name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Pinned-image validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public sources only
        uses: actions/checkout@v4

      - name: Build pinned siliconbench:v1
        # The native docker driver writes straight to the runner's image store.
        # A container-driver Buildx load needlessly re-imports the 700+ MB CAD
        # layer and consumed roughly three minutes in the cold-run acceptance.
        run: |
          docker build --platform linux/amd64 \
            --tag siliconbench:v1 \
            --file flows/Dockerfile \
            flows

      - name: Stage immutable execution source
        run: |
          mkdir -p \
            "$RUNNER_TEMP/siliconbench-source" \
            "$RUNNER_TEMP/siliconbench-output/results" \
            "$RUNNER_TEMP/siliconbench-output/site-build"
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/siliconbench-source"
          chmod -R a+rX "$RUNNER_TEMP/siliconbench-source"
          chmod -R 0777 "$RUNNER_TEMP/siliconbench-output"
          echo "SB_SOURCE=$RUNNER_TEMP/siliconbench-source" >> "$GITHUB_ENV"
          echo "SB_OUTPUT=$RUNNER_TEMP/siliconbench-output" >> "$GITHUB_ENV"

      - name: Verify pinned image identity
        run: |
          docker run --rm --network none --cap-drop=ALL \
            --security-opt no-new-privileges --memory=4g --pids-limit=512 --cpus=2 \
            siliconbench:v1 sh -c '
            test "$(uname -m)" = "x86_64"
            test "$(id -u)" -ne 0
            test "$(cat /etc/siliconbench-image-digest)" = \
              "sha256:20a665db641ebf3c4dc260a30c22817611081b48a749842d38cdc38b10ad8f62"
          '

      - name: Ruff
        run: |
          docker run --rm --network none --cap-drop=ALL \
            --security-opt no-new-privileges --memory=4g --pids-limit=512 --cpus=2 \
            --mount "type=bind,src=$SB_SOURCE,dst=/work,readonly" \
            --mount "type=bind,src=$SB_OUTPUT,dst=/output" \
            --mount "type=bind,src=$SB_OUTPUT/results,dst=/work/results" \
            --workdir /work siliconbench:v1 \
            ruff check --no-cache harness/ scripts/ paper/

      - name: Pytest
        run: |
          docker run --rm --network none --cap-drop=ALL \
            --security-opt no-new-privileges --memory=4g --pids-limit=512 --cpus=2 \
            --mount "type=bind,src=$SB_SOURCE,dst=/work,readonly" \
            --mount "type=bind,src=$SB_OUTPUT,dst=/output" \
            --mount "type=bind,src=$SB_OUTPUT/results,dst=/work/results" \
            --mount "type=bind,src=$SB_OUTPUT/site-build,dst=/work/site/build" \
            --workdir /work siliconbench:v1 \
            python -m pytest -q -p no:cacheprovider \
              --basetemp=/tmp/siliconbench-pytest harness/ scripts/

      - name: T1 reference smoke (non-official)
        # Fork PRs receive no hidden-test mount or provider secret. Official scoring
        # remains fail-closed in the nightly/manual path with SILICONBENCH_HIDDEN_ROOT.
        run: |
          docker run --rm --network none --cap-drop=ALL \
            --security-opt no-new-privileges --memory=4g --pids-limit=512 --cpus=2 \
            --mount "type=bind,src=$SB_SOURCE,dst=/work,readonly" \
            --mount "type=bind,src=$SB_OUTPUT,dst=/output" \
            --mount "type=bind,src=$SB_OUTPUT/results,dst=/work/results" \
            --workdir /work siliconbench:v1 \
            python scripts/ci_t1_smoke.py --jobs 4 --out /output/ci-t1
