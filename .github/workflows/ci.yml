name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Pinned-image validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public sources only
        uses: actions/checkout@v4

      - name: Build pinned gatetruth:v1
        # The native docker driver writes straight to the runner's image store.
        # A container-driver Buildx load needlessly re-imports the 700+ MB CAD
        # layer and consumed roughly three minutes in the cold-run acceptance.
        run: |
          docker build --platform linux/amd64 \
            --tag gatetruth:v1 \
            --file flows/Dockerfile \
            flows

      - name: Stage immutable execution source
        # /work is mounted read-only from this archive below. Nothing under it
        # is writable, including subpaths like results/ or site/build/ that
        # exist in the real tree -- git archive does not materialize
        # site/build/ at all (it's gitignored), so a bind mount targeting
        # /work/site/build has no mountpoint to attach to and fails outright.
        # All writable output goes to /output instead; no step needs to write
        # under /work (tests use pytest's tmp_path fixture via --basetemp,
        # and ci_t1_smoke.py takes an explicit --out under /output).
        run: |
          mkdir -p "$RUNNER_TEMP/gatetruth-source" "$RUNNER_TEMP/gatetruth-output"
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/gatetruth-source"
          chmod -R a+rX "$RUNNER_TEMP/gatetruth-source"
          chmod -R 0777 "$RUNNER_TEMP/gatetruth-output"
          echo "SB_SOURCE=$RUNNER_TEMP/gatetruth-source" >> "$GITHUB_ENV"
          echo "SB_OUTPUT=$RUNNER_TEMP/gatetruth-output" >> "$GITHUB_ENV"

      - name: Verify pinned image identity
        run: |
          docker run --rm --network none --cap-drop=ALL \
            --security-opt no-new-privileges --memory=4g --pids-limit=512 --cpus=2 \
            gatetruth:v1 sh -c '
            test "$(uname -m)" = "x86_64"
            test "$(id -u)" -ne 0
            test "$(cat /etc/gatetruth-image-digest)" = \
              "sha256:bdfe90181574e18c9dfad51bac26c5d27f5685f03e03b68adb7b49f34ff5e2f4"
          '

      - name: Ruff
        run: |
          docker run --rm --network none --cap-drop=ALL \
            --security-opt no-new-privileges --memory=4g --pids-limit=512 --cpus=2 \
            --mount "type=bind,src=$SB_SOURCE,dst=/work,readonly" \
            --mount "type=bind,src=$SB_OUTPUT,dst=/output" \
            --workdir /work gatetruth:v1 \
            ruff check --no-cache harness/ scripts/ paper/

      - name: git diff --check (no trailing whitespace / conflict markers)
        # 4b825dc6... is git's well-known empty-tree object ID; diffing against
        # it lints the entire committed tree, not just this push's delta.
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD

      - name: Pytest
        run: |
          docker run --rm --network none --cap-drop=ALL \
            --security-opt no-new-privileges --memory=4g --pids-limit=512 --cpus=2 \
            --mount "type=bind,src=$SB_SOURCE,dst=/work,readonly" \
            --mount "type=bind,src=$SB_OUTPUT,dst=/output" \
            --workdir /work gatetruth:v1 \
            python -m pytest -q -p no:cacheprovider \
              --basetemp=/tmp/gatetruth-pytest harness/ scripts/ \
            | tee "$SB_OUTPUT/pytest.log"
          tail -n1 "$SB_OUTPUT/pytest.log" | grep -Eq '^[0-9]+ passed' \
            || { echo "::error::pytest did not report an all-passed summary line"; exit 1; }

      - name: T1 reference smoke (non-official)
        # Fork PRs receive no hidden-test mount or provider secret. Official scoring
        # remains fail-closed in the nightly/manual path with GATETRUTH_HIDDEN_ROOT.
        run: |
          docker run --rm --network none --cap-drop=ALL \
            --security-opt no-new-privileges --memory=4g --pids-limit=512 --cpus=2 \
            --mount "type=bind,src=$SB_SOURCE,dst=/work,readonly" \
            --mount "type=bind,src=$SB_OUTPUT,dst=/output" \
            --workdir /work gatetruth:v1 \
            python scripts/ci_t1_smoke.py --jobs 4 --out /output/ci-t1 \
            | tee "$SB_OUTPUT/ci-t1-smoke.log"
          grep -q '^ci_t1_smoke status=PASS' "$SB_OUTPUT/ci-t1-smoke.log" \
            || { echo "::error::T1 smoke did not report status=PASS"; exit 1; }

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Pinned-image validation"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            if [ -f "$SB_OUTPUT/pytest.log" ]; then
              echo "| pytest | $(tail -n1 "$SB_OUTPUT/pytest.log") |"
            else
              echo "| pytest | did not run |"
            fi
            if [ -f "$SB_OUTPUT/ci-t1-smoke.log" ]; then
              echo "| T1 smoke | $(grep '^ci_t1_smoke status=' "$SB_OUTPUT/ci-t1-smoke.log") |"
            else
              echo "| T1 smoke | did not run |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
